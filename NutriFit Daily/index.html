<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c8d40">
  <meta name="description" content="Nutrition, Weight &amp; Activity Tracker">
  <title>NutriFit Daily</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="splash" id="splash" aria-label="Loading NutriFit Daily">
    <div class="brand-mark brand-mark-large" aria-hidden="true">✚</div>
    <h1>NutriFit Daily</h1>
    <p>Nutrition, Weight &amp; Activity Tracker</p>
    <span class="splash-loader" aria-hidden="true"></span>
  </div>

  <main class="app-shell" id="app" hidden>
    <section class="welcome-screen" id="welcomeScreen" hidden>
      <div class="welcome-content">
        <div class="brand-mark brand-mark-large" aria-hidden="true">✚</div>
        <p class="eyebrow">YOUR EVERYDAY WELLNESS COMPANION</p>
        <h1>Welcome to<br>NutriFit Daily</h1>
        <p class="welcome-subtitle">Nutrition, Weight &amp; Activity Tracker</p>
        <form id="welcomeForm" class="form-stack">
          <label for="welcomeName">What should we call you?</label>
          <input id="welcomeName" name="name" type="text" maxlength="32" placeholder="Your name" autocomplete="given-name" required>
          <button class="button button-primary button-full" type="submit">Get started <span aria-hidden="true">→</span></button>
        </form>
        <p class="privacy-note">Your wellness data stays on this device.</p>
      </div>
    </section>

    <div class="main-screen" id="mainScreen" hidden>
      <header class="topbar">
        <a class="brand-lockup" href="#home" data-nav="home" aria-label="NutriFit Daily home">
          <span class="brand-mark" aria-hidden="true">✚</span>
          <span><strong>NutriFit</strong><small>DAILY</small></span>
        </a>
        <button class="avatar-button" type="button" data-nav="profile" aria-label="Open profile"><span id="avatarInitial">N</span></button>
      </header>

      <div class="screen-content" id="screenContent" aria-live="polite"></div>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item is-active" type="button" data-nav="home" aria-current="page"><span aria-hidden="true">⌂</span><small>Home</small></button>
        <button class="nav-item" type="button" data-nav="nutrition"><span aria-hidden="true">◉</span><small>Nutrition</small></button>
        <button class="nav-item" type="button" data-nav="water"><span aria-hidden="true">♒</span><small>Water</small></button>
        <button class="nav-item" type="button" data-nav="activity"><span aria-hidden="true">↗</span><small>Activity</small></button>
        <button class="nav-item" type="button" data-nav="progress"><span aria-hidden="true">▥</span><small>Progress</small></button>
        <button class="nav-item" type="button" data-nav="profile"><span aria-hidden="true">♙</span><small>Profile</small></button>
      </nav>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
